  <!-- Apply display preferences before first paint (DisplayPrefs in js/main.js owns the UI) -->
  <script>
    (function () {
      var root = document.documentElement, get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
      var mq = function (q) { return window.matchMedia && matchMedia(q).matches; };
      var theme = get('hci-theme') || 'system';
      root.setAttribute('data-theme', theme === 'system' ? (mq('(prefers-color-scheme: dark)') ? 'dark' : 'light') : theme);
      var text = get('hci-text');
      if (text && text !== '100') root.setAttribute('data-text', text);
    })();
  </script>
